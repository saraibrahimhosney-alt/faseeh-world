name: Build Faseeh World Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Faseeh APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Project and Copy Your main.dart
        run: |
          flutter create --platforms=android --org com.faseeh.world faseeh_app
          cp main.dart faseeh_app/lib/main.dart

      - name: Build Android APK
        working-directory: faseeh_app
        run: |
          yes "y" | flutter doctor --android-licenses || true
          flutter build apk --debug

      - name: Upload Faseeh World APK
        uses: actions/upload-artifact@v4
        with:
          name: Faseeh-World-Android-APK
          path: faseeh_app/build/app/outputs/flutter-apk/app-debug.apk
