name: Build Faseeh World Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare structure and copy your real audio & images
        run: |
          flutter create . --platforms=android --project-name faseeh_world
          mkdir -p lib assets/images assets/audio
          cp main.dart lib/main.dart
          cp *.png assets/images/ || true
          cp *.mp3 assets/audio/ || true
          ls -la assets/audio/

      - name: Enable Internet permission in AndroidManifest.xml
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Faseeh World APK
        uses: actions/upload-artifact@v4
        with:
          name: faseeh-world-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
