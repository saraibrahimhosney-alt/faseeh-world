name: Build Faseeh World Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Faseeh APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Project and Install Audio Library
        run: |
          flutter create --platforms=android --org com.faseeh.world faseeh_app
          cp main.dart faseeh_app/lib/main.dart
          cd faseeh_app
          flutter pub add audioplayers
          pip3 install --break-system-packages edge-tts gTTS

      - name: Generate Studio Arabic Audio Files
        shell: python3 {0}
        run: |
          import os
          import subprocess
          from gtts import gTTS

          os.makedirs("faseeh_app/assets/audio", exist_ok=True)

          clips = {
              "welcome": "أَهْلاً بِكَ يَا صَدِيقِي البَطَلَ فِي عَالَمِ فَصِيح! اضْغَطْ عَلَى أَيِّ بِطَاقَةٍ لِنَبْدَأَ المَغَامَرَةَ وَنَجْمَعَ النُّجُومَ الذَّهَبِيَّة!",
              "bravo": "أَحْسَنْتَ يَا بَطَلَ الفُصْحَى! إِجَابَةٌ رَائِعَةٌ وَذَكِيَّة!",
              "try_again": "لَا بَأْسَ يَا صَدِيقِي! حَاوِلْ مَرَّةً أُخْرَى، أَنْتَ تَسْتَطِيع!",
              "song_alphabet": "أَلِفٌ أَرْنَبْ، يَجْرِي يَلْعَبْ، يَأْكُلُ جَزَراً كَيْ لَا يَتْعَبْ! بَاءٌ بَطَّةْ، نَطَّتْ نَطَّةْ، وَقَعَتْ ضَحِكَتْ مِنْهَا القِطَّةْ! تَاءٌ تَاجْ، فَوْقَ الرَّأْسْ، فِيهِ الذَّهَبُ وَفِيهِ المَاسْ!",
              "song_morning": "أَشْرَقَتِ الشَّمْسُ الذَّهَبِيَّةْ، وَتَغَنَّتْ طَيْرُ الحُرِّيَّةْ، هَيَّا نَتَعَلَّمْ يَا أَطْفَالْ، لُغَتِي الفُصْحَى أَجْمَلُ حَالْ!",
              "song_numbers": "وَاحِدٌ اثْنَانِ ثَلَاثَةْ، نَتَعَلَّمُ بِذَكَاءٍ وَحَمَاسَةْ! أَرْبَعَةٌ خَمْسَةٌ سِتَّةْ، نَقْرَأُ فِي البُسْتَانِ القِصَّةْ!",
              "word_wahaj": "كَلِمَةُ: وَهَجٌ. وَمَعْنَاهَا: ضَوْءٌ سَاطِعٌ وَجَمِيلٌ. مِثَالٌ: رَأَى فَصِيحٌ وَهَجَ النُّجُومِ فِي السَّمَاءِ.",
              "word_ghadeer": "كَلِمَةُ: غَدِيرٌ. وَمَعْنَاهَا: نَهْرٌ صَغِيرٌ عَذْبُ المَاءِ. مِثَالٌ: شَرِبَ الأَرْنَبُ مِنْ مَاءِ الغَدِيرِ الصَّافِي.",
              "word_hafeef": "كَلِمَةُ: حَفِيفٌ. وَمَعْنَاهَا: صَوْتُ أَوْرَاقِ الشَّجَرِ. مِثَالٌ: سَمِعْنَا حَفِيفَ الأَشْجَارِ مَعَ نَسِيمِ الصَّبَاحِ.",
              "word_taazur": "كَلِمَةُ: تَآزُرٌ. وَمَعْنَاهَا: تَعَاوُنٌ وَاتِّحَادٌ فِي القُوَّةِ. مِثَالٌ: بِالتَّآزُرِ نَجَحَ الأَصْدِقَاءُ فِي عُبُورِ الجِسْرِ.",
              "word_fasaha": "كَلِمَةُ: فَصَاحَةٌ. وَمَعْنَاهَا: بَيَانٌ وَوُضُوحٌ فِي الكَلَامِ. مِثَالٌ: يَتَحَدَّثُ البَطَلُ بِفَصَاحَةٍ وَثِقَةٍ أَمَامَ الجَمِيعِ.",
              "word_mihbara": "كَلِمَةُ: مِحْبَرَةٌ. وَمَعْنَاهَا: وِعَاءٌ يُوضَعُ فِيهِ الحِبْرُ لِلْكِتَابَةِ. مِثَالٌ: كَتَبَ الجَدُّ الحِكَايَةَ بِقَلَمٍ مِنَ المِحْبَرَةِ الذَّهَبِيَّةِ.",
              "word_shaghaf": "كَلِمَةُ: شَغَفٌ. وَمَعْنَاهَا: حُبٌّ شَدِيدٌ وَإِقْبَالٌ عَلَى التَّعَلُّمِ. مِثَالٌ: يَقْرَأُ الطِّفْلُ القِصَصَ بِشَغَفٍ كَبِيرٍ كُلَّ مَسَاءٍ.",
              "word_majarra": "كَلِمَةُ: مَجَرَّةٌ. وَمَعْنَاهَا: تَجَمُّعٌ هَائِلٌ مِنَ النُّجُومِ وَالكَوَاكِبِ. مِثَالٌ: تَسْبَحُ الأَرْضُ فِي مَجَرَّةِ دَرْبِ التَّبَّانَةِ.",
              "word_misbar": "كَلِمَةُ: مِسْبَارٌ. وَمَعْنَاهَا: مَرْكَبَةٌ فَضَائِيَّةٌ لِاسْتِكْشَافِ الكَوَاكِبِ. مِثَالٌ: هَبَطَ المِسْبَارُ عَلَى سَطْحِ كَوْكَبِ المِرِّيخِ بِنَجَاحٍ.",
              "story_rabbit": "قِصَّةُ الأَرْنَبِ الصَّغِيرِ وَسِرِّ الجَزَرَةِ الذَّهَبِيَّةِ. فِي صَبَاحٍ مُشْرِقٍ، خَرَجَ الأَرْنَبُ فَصِيحٌ يَبْحَثُ عَنْ طَعَامٍ فِي الحَقْلِ الأَخْضَرِ الوَاسِعِ. وَجَدَ فَصِيحٌ جَزَرَةً كَبِيرَةً تَلْمَعُ تَحْتَ أَشِعَّةِ الشَّمْسِ، لَكِنَّهَا كَانَتْ عَالِقَةً فِي التُّرْبَةِ. نَادَى فَصِيحٌ أَصْدِقَاءَهُ السِّنْجَابَ وَالسُّلَحْفَاةَ، وَقَالَ بِلُطْفٍ: هَلْ تُسَاعِدُونَنِي يَا أَصْدِقَائِي؟ تَعَاوَنَ الجَمِيعُ بِهِمَّةٍ وَنَشَاطٍ حَتَّى أَخْرَجُوا الجَزَرَةَ، وَتَقَاسَمُوهَا بِسَعَادَةٍ وَمَحَبَّةٍ! الحِكْمَةُ المُسْتَفَادَةُ: بِالتَّعَاوُنِ وَالكَلِمَةِ الطَّيِّبَةِ نُنْجِزُ أَصْعَبَ المَهَامِّ.",
              "story_owl": "قِصَّةُ البُومِ الحَكِيمِ وَطَائِرِ البُلْبُلِ المُغَرِّدِ. كَانَ البُلْبُلُ الصَّغِيرُ يَخْجَلُ مِنَ الغِنَاءِ أَمَامَ طُيُورِ الغَابَةِ خَوْفاً مِنَ الخَطَأِ. اقْتَرَبَ مِنْهُ البُومُ الحَكِيمُ وَقَالَ لَهُ: صَوْتُكَ جَمِيلٌ يَا بُنَيَّ، وَالتَّجْرِبَةُ هِيَ طَرِيقُ النَّجَاحِ! انْطَلَقَ البُلْبُلُ يُغَرِّدُ بِأَعْذَبِ الأَلْحَانِ الفَصِيحَةِ، فَصَفَّقَتْ لَهُ الطُّيُورُ بِإِعْجَابٍ شَدِيدٍ! الحِكْمَةُ المُسْتَفَادَةُ: الثِّقَةُ بِالنَّفْسِ وَالمُحَاوَلَةُ المُسْتَمِرَّةُ تَصْنَعُ الإِبْدَاعَ.",
              "quiz_1": "السُّؤَالُ الأَوَّلُ: مَا المَعْنَى الدَّقِيقُ لِكَلِمَةِ غَدِيرٍ فِي لُغَتِنَا الجَمِيلَةِ؟",
              "quiz_2": "السُّؤَالُ الثَّانِي: أَيُّ جُمْلَةٍ مِنَ الجُمَلِ التَّالِيَةِ مَكْتُوبَةٌ بِالعَرَبِيَّةِ الفُصْحَى السَّلِيمَةِ؟",
              "quiz_3": "السُّؤَالُ الثَّالِثُ: مَاذَا نُسَمِّي صَوْتَ حَرَكَةِ أَوْرَاقِ الشَّجَرِ عِنْدَمَا يَمُرُّ بِهَا الهَوَاءُ؟",
              "quiz_4": "السُّؤَالُ الرَّابِعُ: مَا ضِدُّ كَلِمَةِ شُجَاعٍ فِي اللُّغَةِ العَرَبِيَّةِ؟",
          }

          for name, text in clips.items():
              out_path = f"faseeh_app/assets/audio/{name}.mp3"
              res = subprocess.run([
                  "edge-tts",
                  "--voice", "ar-SA-ZariyahNeural",
                  "--rate=-5%",
                  "--text", text,
                  "--write-media", out_path
              ])
              if res.returncode != 0 or not os.path.exists(out_path):
                  tts = gTTS(text=text, lang="ar")
                  tts.save(out_path)

          pub_path = "faseeh_app/pubspec.yaml"
          with open(pub_path, "r", encoding="utf-8") as f:
              pub_text = f.read()
          pub_text = pub_text.replace(
              "uses-material-design: true",
              "uses-material-design: true\n  assets:\n    - assets/audio/"
          )
          with open(pub_path, "w", encoding="utf-8") as f:
              f.write(pub_text)

          man_path = "faseeh_app/android/app/src/main/AndroidManifest.xml"
          if os.path.exists(man_path):
              with open(man_path, "r", encoding="utf-8") as f:
                  man_text = f.read()
              man_text = man_text.replace('android:label="faseeh_app"', 'android:label="عالم فصيح"')
              with open(man_path, "w", encoding="utf-8") as f:
                  f.write(man_text)

      - name: Build Android APK
        working-directory: faseeh_app
        run: |
          yes "y" | flutter doctor --android-licenses || true
          flutter build apk --debug

      - name: Upload Faseeh World APK
        uses: actions/upload-artifact@v4
        with:
          name: Faseeh-World-Android-APK
          path: faseeh_app/build/app/outputs/flutter-apk/app-debug.apk
