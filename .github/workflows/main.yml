name: Build Faseeh World Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project structure
        run: |
          flutter create --org com.faseeh.world --project-name faseeh_world .
          rm -rf test

      - name: Add dependencies
        run: |
          flutter pub add audioplayers
          flutter pub add youtube_explode_dart
          flutter pub add video_player

      - name: Enable Internet permission in AndroidManifest.xml
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Configure assets in pubspec.yaml
        run: |
          mkdir -p assets/images assets/audio
          if [ -d "images" ]; then cp -r images/* assets/images/ 2>/dev/null || true; fi
          if [ -d "audio" ]; then cp -r audio/* assets/audio/ 2>/dev/null || true; fi
          cp *.png assets/images/ 2>/dev/null || true
          cp *.jpg assets/images/ 2>/dev/null || true
          cp *.mp3 assets/audio/ 2>/dev/null || true
          python3 -c '
          with open("pubspec.yaml", "r") as f:
              content = f.read()
          assets_block = "\n  assets:\n    - assets/images/\n    - assets/audio/\n"
          if "uses-material-design: true" in content:
              content = content.replace("uses-material-design: true", "uses-material-design: true" + assets_block)
          with open("pubspec.yaml", "w") as f:
              f.write(content)
          '

      - name: Place main.dart into lib/
        run: |
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload Faseeh World APK
        uses: actions/upload-artifact@v4
        with:
          name: Faseeh-World-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
