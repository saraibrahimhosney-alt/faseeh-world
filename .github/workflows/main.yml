name: Build Faseeh World Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Faseeh APK
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Clean Flutter Android Project
        run: |
          flutter create --platforms=android --org com.faseeh.world faseeh_app
          cat << 'EOF' > faseeh_app/lib/main.dart
          import 'package:flutter/material.dart';

          void main() => runApp(const MaterialApp(
                title: 'عالم فصيح',
                debugShowCheckedModeBanner: false,
                home: Directionality(
                  textDirection: TextDirection.rtl,
                  child: FaseehHome(),
                ),
              ));

          class FaseehHome extends StatefulWidget {
            const FaseehHome({super.key});
            @override
            State<FaseehHome> createState() => _FaseehHomeState();
          }

          class _FaseehHomeState extends State<FaseehHome> {
            int _stars = 30;
            String _speech = 'أهلاً بك يا بطل في عالم فصيح!';

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0EA5E9),
                  title: const Text('🦉 عالم فصيح للأطفال', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                  actions: [
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: Text('⭐ $_stars نجمة', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.yellow, fontSize: 16)),
                    )
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Card(
                      color: const Color(0xFFE0F2FE),
                      child: Padding(
                        padding: const EdgeInsets.all(16),
                        child: Text(_speech, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      ),
                    ),
                    const SizedBox(height: 12),
                    ElevatedButton.icon(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF0EA5E9), foregroundColor: Colors.white, padding: const EdgeInsets.all(16)),
                      onPressed: () => setState(() {
                        _stars += 5;
                        _speech = 'أحسنت! كلمة «بُسْتان» تعني الحديقة الواسعة.';
                      }),
                      icon: const Icon(Icons.play_circle_fill),
                      label: const Text('🎬 مشاهدة حلقة فصيح في البستان (+5 ⭐)', style: TextStyle(fontSize: 16)),
                    ),
                    const SizedBox(height: 12),
                    ElevatedButton.icon(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF10B981), foregroundColor: Colors.white, padding: const EdgeInsets.all(16)),
                      onPressed: () => setState(() {
                        _stars += 10;
                        _speech = 'ممتاز! إجابة صحيحة: المِجْهَر آلة تكبير الأشياء الدقيقة.';
                      }),
                      icon: const Icon(Icons.sports_esports),
                      label: const Text('🎮 بدء تحدي الذكاء اللغوي (+10 ⭐)', style: TextStyle(fontSize: 16)),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build Android APK
        working-directory: faseeh_app
        run: |
          yes "y" | flutter doctor --android-licenses || true
          flutter build apk --debug

      - name: Upload Faseeh World APK
        uses: actions/upload-artifact@v4
        with:
          name: Faseeh-World-Android-APK
          path: faseeh_app/build/app/outputs/flutter-apk/app-debug.apk
