name: Build Faseeh World Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare assets and pubspec
        run: |
          flutter create . --platforms=android --project-name faseeh_world
          mkdir -p lib assets/images assets/audio
          [ -f "main.dart" ] && cp main.dart lib/main.dart
          find . -maxdepth 2 -type f -name "*.png" ! -path "./android/*" ! -path "./assets/*" -exec cp {} assets/images/ \;
          find . -maxdepth 2 -type f -name "*.mp3" ! -path "./android/*" ! -path "./assets/*" -exec cp {} assets/audio/ \;
          python3 -c '
          from pathlib import Path
          p = Path("pubspec.yaml")
          t = p.read_text(encoding="utf-8")
          t = t.replace("  cupertino_icons: ^1.0.8\n", "  cupertino_icons: ^1.0.8\n  audioplayers: ^6.1.0\n  webview_flutter: ^4.10.0\n")
          if "assets/images/" not in t:
              t = t.replace("  uses-material-design: true\n", "  uses-material-design: true\n  assets:\n    - assets/images/\n    - assets/audio/\n")
          p.write_text(t, encoding="utf-8")
          '
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: faseeh-world-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
