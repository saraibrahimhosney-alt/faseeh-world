name: Build Faseeh World Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Faseeh APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Project and Bundle Custom Media Assets
        run: |
          flutter create --platforms=android --org com.faseeh.world faseeh_app
          cp main.dart faseeh_app/lib/main.dart
          mkdir -p faseeh_app/assets/audio faseeh_app/assets/images
          cp *.mp3 faseeh_app/assets/audio/ || true
          cp *.png faseeh_app/assets/images/ || true
          cp *.jpg faseeh_app/assets/images/ || true
          cd faseeh_app
          flutter pub add audioplayers youtube_player_flutter

      - name: Configure Assets and App Label
        shell: python3 {0}
        run: |
          import os
          pub_path = "faseeh_app/pubspec.yaml"
          with open(pub_path, "r", encoding="utf-8") as f:
              pub_text = f.read()
          pub_text = pub_text.replace(
              "uses-material-design: true",
              "uses-material-design: true\n  assets:\n    - assets/audio/\n    - assets/images/"
          )
          with open(pub_path, "w", encoding="utf-8") as f:
              f.write(pub_text)

          man_path = "faseeh_app/android/app/src/main/AndroidManifest.xml"
          if os.path.exists(man_path):
              with open(man_path, "r", encoding="utf-8") as f:
                  man_text = f.read()
              man_text = man_text.replace('android:label="faseeh_app"', 'android:label="عالم فصيح"')
              with open(man_path, "w", encoding="utf-8") as f:
                  f.write(man_text)

      - name: Build Android APK
        working-directory: faseeh_app
        run: |
          yes "y" | flutter doctor --android-licenses || true
          flutter build apk --debug

      - name: Upload Faseeh World APK
        uses: actions/upload-artifact@v4
        with:
          name: Faseeh-World-Android-APK
          path: faseeh_app/build/app/outputs/flutter-apk/app-debug.apk
